<!DOCTYPE html>
<html>
<head>
  <!--
    Flutter's web build used to ship a service worker that could keep
    serving an older cached version of the app even after a normal reload —
    remove any such leftover on every load so updates always take effect.
    push_sw.js (push notifications only, no caching) is kept.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) {
          var worker = regs[i].active || regs[i].waiting || regs[i].installing;
          if (worker && worker.scriptURL.indexOf('push_sw.js') !== -1) continue;
          regs[i].unregister();
        }
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (names) {
        for (var i = 0; i < names.length; i++) caches.delete(names[i]);
      });
    }
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Android Chrome (108+) no longer shrinks the page when the on-screen
    keyboard opens, it just draws the keyboard over it, so Flutter never lifts
    the focused text field above it. interactive-widget=resizes-content
    restores the resizing. Flutter replaces the viewport tag with its own at
    startup, so re-apply it to whichever viewport tag ends up in the head.
  -->
  <script>
    (function () {
      function patch() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var content = metas[i].getAttribute('content') || '';
          if (content.indexOf('interactive-widget') === -1) {
            metas[i].setAttribute('content', content + ', interactive-widget=resizes-content');
          }
        }
      }
      patch();
      new MutationObserver(patch).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content'],
      });
    })();
  </script>
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="samepace">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SAMEPACE</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="push_helper.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
